name: Deploy theme

on:
  push:
    branches: [main]
    paths:
      - 'theme/**'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:

concurrency:
  group: deploy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install npm dependencies
        working-directory: theme
        run: npm ci

      - name: Build assets
        working-directory: theme
        run: npm run build

      - name: Install composer dependencies
        working-directory: theme
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-progress

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: httpdocs/wp-content/themes/qazaqstan/
          local-dir: ./theme/
          dangerous-clean-slate: false
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.DS_Store
            **/resources/css/**
            **/resources/js/**
            **/.editorconfig
            **/composer.lock
            **/package-lock.json
            **/vite.config.js
            **/package.json
            **/README.md
            **/LICENSE.md
